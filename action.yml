name: Prepare NVDA source
description: Checkout and build a runnable NVDA source tree for add-on development (scons source)

inputs:
  python-version:
    description: Python version to install
    required: true
  python-arch:
    description: Python architecture (x86 or x64)
    required: true
  nvda-ref:
    description: Git ref to checkout (tag or branch)
    required: true
  github-token:
    description: GitHub token for API access (used to resolve the NVDA ref to a commit SHA)
    required: true
  scons-args:
    description: Extra arguments appended to `scons source` (e.g. -j2, version=...)
    required: false
    default: "-j2"
  install-vs-components:
    description: >-
      Whether to install the VS components from NVDA's .vsconfig at runtime. Set to false on
      runner images that already ship the required Visual Studio toolset (e.g. a custom VS 2026
      image) to skip the install and behave like nvaccess/nvda's own build.
    required: false
    default: "true"
  vs-version:
    description: >-
      Major Visual Studio version to select when installing components (e.g. 17 for VS 2022, 18
      for VS 2026). Leave empty to use the latest installed VS. Only used when
      install-vs-components is true.
    required: false
    default: ""

outputs:
  nvda-ref:
    description: The NVDA ref that was checked out
    value: ${{ inputs.nvda-ref }}
  nvda-path:
    description: Path to the built NVDA source tree, relative to the workspace
    value: nvda
  cache-hit:
    description: Whether the NVDA cache was hit
    value: ${{ steps.cache-nvda.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        architecture: ${{ inputs.python-arch }}

    # NVDA's x64 builds contain 32-bit components, so a matching 32-bit interpreter is required to
    # build them. x86 builds already have a 32-bit primary interpreter, so this is skipped there.
    - name: Set up Python (32 bit)
      if: inputs.python-arch == 'x64'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        architecture: x86
        update-environment: false

    - name: Get NVDA commit SHA
      id: get-sha
      shell: bash
      run: |
        SHA=$(gh api repos/nvaccess/nvda/commits/${{ inputs.nvda-ref }} --jq '.sha')
        echo "sha=$SHA" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ inputs.github-token }}

    - name: Cache NVDA
      id: cache-nvda
      uses: actions/cache@v5
      with:
        path: nvda
        key: ${{ runner.os }}-nvda-${{ inputs.python-version }}-${{ inputs.python-arch }}-${{ steps.get-sha.outputs.sha }}

    - name: Checkout NVDA
      if: steps.cache-nvda.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: nvaccess/nvda
        submodules: recursive
        path: nvda
        ref: ${{ inputs.nvda-ref }}

    # Installed after NVDA is available (from checkout or the restored cache) so setup-uv can key its
    # cache on NVDA's lockfile. uv is only needed for `scons source`, which runs after this.
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: nvda/uv.lock

    - name: Install Visual Studio components
      if: steps.cache-nvda.outputs.cache-hit != 'true' && inputs.install-vs-components == 'true'
      shell: pwsh
      run: |
        $installerDir = "C:\Program Files (x86)\Microsoft Visual Studio\Installer"
        # Locate the VS install with vswhere instead of hardcoding an edition/path, so this works
        # across Community/Enterprise/BuildTools and different VS versions.
        $vswhere = Join-Path $installerDir "vswhere.exe"
        $vsArgs = @('-latest', '-products', '*', '-property', 'installationPath')
        $vsVersion = '${{ inputs.vs-version }}'
        if ($vsVersion) {
          $next = [int]$vsVersion + 1
          $vsArgs += @('-version', "[$vsVersion.0,$next.0)")
        }
        $InstallPath = (& $vswhere @vsArgs | Select-Object -First 1)
        if (-not $InstallPath) {
          throw "No Visual Studio installation found (vswhere returned nothing for version '$vsVersion')."
        }
        Write-Host "Using Visual Studio at: $InstallPath"
        $ConfigPath = Join-Path -Path ${env:GITHUB_WORKSPACE} -ChildPath "nvda\.vsconfig"
        Set-Location $installerDir
        $Arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", '--config', "`"$ConfigPath`"", '--quiet', '--norestart', '--nocache', '--includeRecommended')
        # should be run twice
        Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden | Out-Null
        Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden | Out-Null

    # ImageVersion is a runner-set env var and isn't available in the `env` expression context, so
    # build the key in a shell step (mirrors nvaccess/nvda). The .vsconfig hash keeps the cache
    # correct when the installed VS components differ between NVDA versions.
    - name: Compute SCons MSVC cache key
      if: steps.cache-nvda.outputs.cache-hit != 'true'
      shell: bash
      run: echo "SCONS_MSVC_CACHE_KEY=${RUNNER_OS}-scons-msvc-${ImageVersion}-${{ inputs.vs-version }}-${{ hashFiles('nvda/.vsconfig') }}" >> $GITHUB_ENV

    - name: Cache SCons MSVC config
      if: steps.cache-nvda.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: .scons_msvc_cache.json
        key: ${{ env.SCONS_MSVC_CACHE_KEY }}

    - name: Prepare NVDA's source tree
      if: steps.cache-nvda.outputs.cache-hit != 'true'
      shell: cmd
      env:
        SCONS_CACHE_MSVC_CONFIG: ${{ github.workspace }}/.scons_msvc_cache.json
        VSCMD_SKIP_SENDTELEMETRY: "1"
      run: |
        cd nvda
        scons source ${{ inputs.scons-args }}
