name: Self-test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  prepare-nvda:
    name: Prepare NVDA ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "2025.3"
            python: "3.11"
            arch: x86
            ref: release-2025.3.3
          - name: "2026.1"
            python: "3.13.12"
            arch: x64
            ref: release-2026.1

    steps:
      - name: Checkout action
        uses: actions/checkout@v7

      - name: Prepare NVDA source
        id: prepare
        uses: ./
        with:
          python-version: ${{ matrix.python }}
          python-arch: ${{ matrix.arch }}
          nvda-ref: ${{ matrix.ref }}
          github-token: ${{ github.token }}

      - name: Assert NVDA clone is runnable
        shell: pwsh
        env:
          PYTHONPATH: nvda/source;nvda/miscDeps/python
        run: |
          $py = "nvda/.venv/Scripts/python.exe"
          if (-not (Test-Path $py)) {
            throw "Expected NVDA venv python at $py (scons source did not produce a venv)"
          }
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw "NVDA venv python failed to run" }
          # buildVersion is generated by `scons source` and is import-safe (no gettext/localization
          # setup required), so importing it proves the source tree was actually built.
          & $py -c "import buildVersion; print('NVDA source importable:', buildVersion.name, buildVersion.version)"
          if ($LASTEXITCODE -ne 0) { throw "NVDA source tree is not importable (buildVersion missing - scons source did not run)" }
          Write-Host "cache-hit=${{ steps.prepare.outputs.cache-hit }} nvda-path=${{ steps.prepare.outputs.nvda-path }}"
